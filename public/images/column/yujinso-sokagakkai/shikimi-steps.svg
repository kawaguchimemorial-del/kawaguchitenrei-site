<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="しきみ焼香の所作を5ステップで示した図">
  <rect width="800" height="450" fill="#faf8f3"/>
  <g font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" fill="#131c18">
    <text x="400" y="58" text-anchor="middle" font-size="22" font-weight="600">しきみ焼香の所作（一般的な目安）</text>
    <text x="400" y="84" text-anchor="middle" font-size="13" fill="#4a5b54">会場の案内に従えば失礼にはなりません</text>

    <g>
      <circle cx="115" cy="220" r="38" fill="#ffffff" stroke="#2a5145" stroke-width="2"/>
      <text x="115" y="216" text-anchor="middle" font-size="11" fill="#4a5b54">STEP</text>
      <text x="115" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#2a5145">1</text>
      <text x="115" y="285" text-anchor="middle" font-size="13" font-weight="600">焼香台で</text>
      <text x="115" y="303" text-anchor="middle" font-size="13" font-weight="600">一礼</text>
    </g>
    <line x1="155" y1="220" x2="200" y2="220" stroke="#7a8a82" stroke-width="1.5"/>

    <g>
      <circle cx="240" cy="220" r="38" fill="#ffffff" stroke="#2a5145" stroke-width="2"/>
      <text x="240" y="216" text-anchor="middle" font-size="11" fill="#4a5b54">STEP</text>
      <text x="240" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#2a5145">2</text>
      <text x="240" y="285" text-anchor="middle" font-size="13" font-weight="600">しきみを</text>
      <text x="240" y="303" text-anchor="middle" font-size="13" font-weight="600">左手で持つ</text>
    </g>
    <line x1="280" y1="220" x2="325" y2="220" stroke="#7a8a82" stroke-width="1.5"/>

    <g>
      <circle cx="365" cy="220" r="38" fill="#ffffff" stroke="#2a5145" stroke-width="2"/>
      <text x="365" y="216" text-anchor="middle" font-size="11" fill="#4a5b54">STEP</text>
      <text x="365" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#2a5145">3</text>
      <text x="365" y="285" text-anchor="middle" font-size="13" font-weight="600">香炉に</text>
      <text x="365" y="303" text-anchor="middle" font-size="13" font-weight="600">1〜3 回くべる</text>
    </g>
    <line x1="405" y1="220" x2="450" y2="220" stroke="#7a8a82" stroke-width="1.5"/>

    <g>
      <circle cx="490" cy="220" r="38" fill="#ffffff" stroke="#2a5145" stroke-width="2"/>
      <text x="490" y="216" text-anchor="middle" font-size="11" fill="#4a5b54">STEP</text>
      <text x="490" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#2a5145">4</text>
      <text x="490" y="285" text-anchor="middle" font-size="13" font-weight="600">合掌</text>
      <text x="490" y="303" text-anchor="middle" font-size="13" font-weight="600">（心中で唱題）</text>
    </g>
    <line x1="530" y1="220" x2="575" y2="220" stroke="#7a8a82" stroke-width="1.5"/>

    <g>
      <circle cx="615" cy="220" r="38" fill="#ffffff" stroke="#2a5145" stroke-width="2"/>
      <text x="615" y="216" text-anchor="middle" font-size="11" fill="#4a5b54">STEP</text>
      <text x="615" y="236" text-anchor="middle" font-size="20" font-weight="700" fill="#2a5145">5</text>
      <text x="615" y="285" text-anchor="middle" font-size="13" font-weight="600">一礼して</text>
      <text x="615" y="303" text-anchor="middle" font-size="13" font-weight="600">席へ戻る</text>
    </g>

    <rect x="80" y="350" width="640" height="60" rx="6" fill="#f1ede2" stroke="#d3d9d0"/>
    <text x="400" y="375" text-anchor="middle" font-size="13" fill="#1f2d27">「しきみ（樒）」は仏教で清浄を表す植物。抹香の代わりに葉そのものを供えます。</text>
    <text x="400" y="395" text-anchor="middle" font-size="12" fill="#4a5b54">回数や所作は地域・組織で異なるため、会場の案内に従って差し支えありません。</text>
  </g>
</svg>
