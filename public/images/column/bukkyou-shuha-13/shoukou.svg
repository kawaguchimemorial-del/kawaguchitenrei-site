<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="宗派ごとの焼香回数と額にいただくかどうかの目安をまとめた図">
  <rect width="800" height="450" fill="#faf8f3"/>
  <g font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" fill="#131c18">
    <text x="400" y="50" text-anchor="middle" font-size="22" font-weight="600">焼香の目安（一般的な傾向）</text>
    <text x="400" y="74" text-anchor="middle" font-size="12" fill="#4a5b54">寺院の作法が優先されます。会場の案内に従えば失礼にはなりません。</text>

    <g>
      <rect x="60" y="100" width="220" height="260" rx="10" fill="#ffffff" stroke="#2a5145" stroke-width="2"/>
      <rect x="60" y="100" width="220" height="40" fill="#2a5145" rx="10"/>
      <rect x="60" y="126" width="220" height="14" fill="#2a5145"/>
      <text x="170" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3 回</text>
      <text x="170" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3a30">額にいただくことが多い</text>
      <g transform="translate(170, 220)">
        <circle cx="0" cy="0" r="22" fill="#f1e8d0" stroke="#a6864a"/>
        <path d="M -8 -4 Q 0 -14 8 -4" stroke="#1f2d27" fill="none" stroke-width="1.5"/>
        <path d="M -16 -22 L -10 -12" stroke="#a6864a" stroke-width="2"/>
        <circle cx="-10" cy="-12" r="2" fill="#a6864a"/>
      </g>
      <g font-size="12" fill="#1f2d27">
        <text x="170" y="280" text-anchor="middle">浄土宗 / 真言宗</text>
        <text x="170" y="300" text-anchor="middle">天台宗 / 日蓮宗</text>
        <text x="170" y="320" text-anchor="middle">融通念仏宗</text>
      </g>
      <text x="170" y="348" text-anchor="middle" font-size="11" fill="#7a8a82">指でつまみ額にあてて香炉へ</text>
    </g>

    <g>
      <rect x="290" y="100" width="220" height="260" rx="10" fill="#ffffff" stroke="#58806f" stroke-width="2"/>
      <rect x="290" y="100" width="220" height="40" fill="#58806f" rx="10"/>
      <rect x="290" y="126" width="220" height="14" fill="#58806f"/>
      <text x="400" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2 回</text>
      <text x="400" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3a30">1 回いただく＋1 回そのまま</text>
      <g transform="translate(400, 220)">
        <circle cx="0" cy="0" r="22" fill="#d6e1d8" stroke="#58806f"/>
        <path d="M -8 -4 Q 0 -14 8 -4" stroke="#1f2d27" fill="none" stroke-width="1.5"/>
        <path d="M -16 -22 L -10 -12" stroke="#58806f" stroke-width="2"/>
        <circle cx="-10" cy="-12" r="2" fill="#58806f"/>
      </g>
      <g font-size="12" fill="#1f2d27">
        <text x="400" y="280" text-anchor="middle">曹洞宗</text>
      </g>
      <text x="400" y="320" text-anchor="middle" font-size="11" fill="#7a8a82">1 回目は額に</text>
      <text x="400" y="338" text-anchor="middle" font-size="11" fill="#7a8a82">2 回目はそのまま</text>
    </g>

    <g>
      <rect x="520" y="100" width="220" height="260" rx="10" fill="#ffffff" stroke="#a6864a" stroke-width="2"/>
      <rect x="520" y="100" width="220" height="40" fill="#a6864a" rx="10"/>
      <rect x="520" y="126" width="220" height="14" fill="#a6864a"/>
      <text x="630" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1 回</text>
      <text x="630" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#1c3a30">額にいただかない</text>
      <g transform="translate(630, 220)">
        <circle cx="0" cy="0" r="22" fill="#f1ede2" stroke="#a6864a"/>
        <path d="M -8 -4 Q 0 -14 8 -4" stroke="#1f2d27" fill="none" stroke-width="1.5"/>
        <path d="M 16 0 L 30 -10" stroke="#a6864a" stroke-width="2"/>
        <circle cx="30" cy="-10" r="2" fill="#a6864a"/>
      </g>
      <g font-size="12" fill="#1f2d27">
        <text x="630" y="280" text-anchor="middle">浄土真宗</text>
        <text x="630" y="300" text-anchor="middle">臨済宗</text>
      </g>
      <text x="630" y="338" text-anchor="middle" font-size="11" fill="#7a8a82">そのまま香炉へくべる</text>
    </g>

    <rect x="60" y="380" width="680" height="42" rx="6" fill="#f1ede2" stroke="#d3d9d0"/>
    <text x="400" y="398" text-anchor="middle" font-size="12" fill="#1f2d27">迷ったら 1 回で丁寧に。会場アナウンスや係の案内が最優先です。</text>
    <text x="400" y="416" text-anchor="middle" font-size="11" fill="#7a8a82">同宗派でも地域・寺院により作法が異なることがあります。</text>
  </g>
</svg>
