<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="一般葬・家族葬・密葬の参列範囲を大きさで比較した図">
  <rect width="800" height="450" fill="#faf8f3"/>
  <g font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" fill="#131c18">
    <text x="400" y="58" text-anchor="middle" font-size="22" font-weight="600">参列範囲のイメージ</text>
    <text x="400" y="84" text-anchor="middle" font-size="13" fill="#4a5b54">人数の規模感を 3 つの葬儀形式で比較</text>

    <g>
      <circle cx="170" cy="240" r="105" fill="#d6e1d8" stroke="#58806f" stroke-width="2"/>
      <circle cx="170" cy="240" r="70" fill="#58806f" stroke="#2a5145" stroke-width="2"/>
      <circle cx="170" cy="240" r="38" fill="#2a5145"/>
      <text x="170" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">家族</text>
      <text x="170" y="220" text-anchor="middle" font-size="11" fill="#ffffff">中心</text>
      <text x="170" y="160" text-anchor="middle" font-size="10" fill="#1c3a30">職場・地域</text>
      <text x="170" y="372" text-anchor="middle" font-size="17" font-weight="700">一般葬</text>
      <text x="170" y="392" text-anchor="middle" font-size="12" fill="#4a5b54">広く一般参列者を招く</text>
    </g>

    <g>
      <circle cx="400" cy="240" r="70" fill="#d6e1d8" stroke="#2a5145" stroke-width="2.5"/>
      <circle cx="400" cy="240" r="38" fill="#2a5145"/>
      <text x="400" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">家族</text>
      <text x="400" y="220" text-anchor="middle" font-size="11" fill="#ffffff">中心</text>
      <text x="400" y="194" text-anchor="middle" font-size="10" fill="#1c3a30">親族・親しい友人</text>
      <text x="400" y="372" text-anchor="middle" font-size="17" font-weight="700">家族葬</text>
      <text x="400" y="392" text-anchor="middle" font-size="12" fill="#4a5b54">家族・親族中心で完結</text>
    </g>

    <g>
      <circle cx="630" cy="240" r="38" fill="#2a5145" stroke="#1c3a30" stroke-width="2.5"/>
      <text x="630" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">近親者</text>
      <text x="630" y="220" text-anchor="middle" font-size="11" fill="#ffffff">のみ</text>
      <text x="630" y="372" text-anchor="middle" font-size="17" font-weight="700">密葬</text>
      <text x="630" y="392" text-anchor="middle" font-size="12" fill="#4a5b54">後日の本葬を前提に小さく</text>
    </g>
  </g>
</svg>
