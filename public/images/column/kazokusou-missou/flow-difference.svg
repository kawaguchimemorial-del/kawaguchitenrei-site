<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="家族葬と密葬の葬送フローの違いを比較した図">
  <rect width="800" height="450" fill="#faf8f3"/>
  <g font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" fill="#131c18">
    <text x="400" y="58" text-anchor="middle" font-size="22" font-weight="600">葬送の流れで見る家族葬と密葬の違い</text>

    <text x="80" y="148" font-size="15" font-weight="700" fill="#2a5145">家族葬</text>
    <rect x="80" y="160" width="640" height="6" fill="#e6ebe3" rx="3"/>
    <rect x="80" y="160" width="240" height="6" fill="#2a5145" rx="3"/>
    <g>
      <rect x="80" y="180" width="240" height="64" rx="8" fill="#ffffff" stroke="#2a5145" stroke-width="2"/>
      <text x="200" y="208" text-anchor="middle" font-size="14" font-weight="700">家族葬で完結</text>
      <text x="200" y="230" text-anchor="middle" font-size="12" fill="#4a5b54">通夜 → 告別式 → 火葬</text>
    </g>
    <text x="340" y="208" font-size="13" fill="#4a5b54">本葬・お別れ会は予定しない</text>
    <text x="340" y="228" font-size="12" fill="#7a8a82">香典・弔問対応も家族葬の場で完結</text>

    <line x1="80" y1="278" x2="720" y2="278" stroke="#e6ebe3" stroke-dasharray="4 4"/>

    <text x="80" y="308" font-size="15" font-weight="700" fill="#a6864a">密葬</text>
    <rect x="80" y="320" width="640" height="6" fill="#e6ebe3" rx="3"/>
    <rect x="80" y="320" width="640" height="6" fill="#a6864a" rx="3"/>
    <g>
      <rect x="80" y="340" width="220" height="64" rx="8" fill="#ffffff" stroke="#a6864a" stroke-width="2"/>
      <text x="190" y="368" text-anchor="middle" font-size="14" font-weight="700">密葬</text>
      <text x="190" y="390" text-anchor="middle" font-size="12" fill="#4a5b54">近親者のみで火葬まで</text>
    </g>
    <path d="M 305 372 L 345 372" stroke="#7a8a82" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="325" y="362" text-anchor="middle" font-size="11" fill="#4a5b54">約 1 か月</text>
    <g>
      <rect x="355" y="340" width="240" height="64" rx="8" fill="#a6864a" stroke="#a6864a" stroke-width="2"/>
      <text x="475" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">本葬・お別れ会</text>
      <text x="475" y="390" text-anchor="middle" font-size="12" fill="#f1e8d0">後日 広く案内・香典対応</text>
    </g>
    <text x="610" y="368" font-size="13" fill="#4a5b54">2 段構えの</text>
    <text x="610" y="386" font-size="13" fill="#4a5b54">葬送スタイル</text>
  </g>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8a82"/>
    </marker>
  </defs>
</svg>
