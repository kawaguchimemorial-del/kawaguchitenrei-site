<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="死亡届と死亡診断書が一体になった用紙の構成図">
  <rect width="800" height="450" fill="#faf8f3"/>
  <g font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" fill="#131c18">
    <text x="400" y="58" text-anchor="middle" font-size="22" font-weight="600">死亡届の用紙は左右に分かれています</text>
    <text x="400" y="84" text-anchor="middle" font-size="14" fill="#4a5b54">1 枚の用紙の左右で「届出」と「診断書」を構成</text>

    <rect x="90" y="120" width="280" height="240" fill="#ffffff" stroke="#2a5145" stroke-width="2.5" rx="6"/>
    <rect x="90" y="120" width="280" height="38" fill="#2a5145" rx="6"/>
    <rect x="90" y="148" width="280" height="10" fill="#2a5145"/>
    <text x="230" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">死亡届（左半分）</text>
    <text x="230" y="190" text-anchor="middle" font-size="15" fill="#1f2d27">記入：届出人（ご家族）</text>
    <g font-size="13" fill="#4a5b54">
      <text x="110" y="220">・氏名・生年月日</text>
      <text x="110" y="244">・死亡日時・場所</text>
      <text x="110" y="268">・住所・本籍</text>
      <text x="110" y="292">・届出人との続柄</text>
      <text x="110" y="316">・届出人の署名</text>
    </g>
    <text x="230" y="345" text-anchor="middle" font-size="12" fill="#7a8a82">※ 印鑑は自治体により不要</text>

    <rect x="430" y="120" width="280" height="240" fill="#ffffff" stroke="#a6864a" stroke-width="2.5" rx="6"/>
    <rect x="430" y="120" width="280" height="38" fill="#a6864a" rx="6"/>
    <rect x="430" y="148" width="280" height="10" fill="#a6864a"/>
    <text x="570" y="146" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">死亡診断書（右半分）</text>
    <text x="570" y="190" text-anchor="middle" font-size="15" fill="#1f2d27">記入：医師</text>
    <g font-size="13" fill="#4a5b54">
      <text x="450" y="220">・死亡の原因</text>
      <text x="450" y="244">・死亡の種類</text>
      <text x="450" y="268">・診断・検案者氏名</text>
      <text x="450" y="292">・診断日時</text>
      <text x="450" y="316">・医師の押印</text>
    </g>
    <text x="570" y="345" text-anchor="middle" font-size="12" fill="#7a8a82">※ 病院外は「死体検案書」</text>

    <text x="400" y="400" text-anchor="middle" font-size="13" fill="#4a5b54">この 1 枚を市区町村役場へ提出 → 火葬許可証が交付されます</text>
  </g>
</svg>
