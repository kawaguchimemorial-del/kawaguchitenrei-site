<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="お盆でお供えする五供 香花灯明浄水飲食 の解説図">
  <rect width="800" height="450" fill="#faf8f3"/>
  <g font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" fill="#131c18">
    <text x="400" y="58" text-anchor="middle" font-size="22" font-weight="600">お盆でお供えする五供（ごく）</text>
    <text x="400" y="84" text-anchor="middle" font-size="13" fill="#4a5b54">迎え盆の日に揃えたい 5 つのお供え</text>

    <g>
      <rect x="60" y="120" width="135" height="220" rx="10" fill="#ffffff" stroke="#a6864a" stroke-width="2"/>
      <g transform="translate(127, 190)">
        <path d="M 0 -30 Q -8 -20 -3 -10 Q 3 -2 0 6" stroke="#7a8a82" stroke-width="2" fill="none"/>
        <rect x="-3" y="6" width="6" height="18" fill="#a6864a"/>
        <rect x="-12" y="22" width="24" height="6" fill="#1f2d27"/>
      </g>
      <text x="127" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#a6864a">香</text>
      <text x="127" y="278" text-anchor="middle" font-size="12" fill="#1f2d27">線香</text>
      <text x="127" y="298" text-anchor="middle" font-size="11" fill="#4a5b54">場を清める</text>
      <text x="127" y="316" text-anchor="middle" font-size="11" fill="#4a5b54">香り</text>
    </g>

    <g>
      <rect x="215" y="120" width="135" height="220" rx="10" fill="#ffffff" stroke="#58806f" stroke-width="2"/>
      <g transform="translate(282, 200)">
        <ellipse cx="0" cy="0" rx="32" ry="22" fill="#d6e1d8" stroke="#58806f"/>
        <ellipse cx="-12" cy="-6" rx="10" ry="10" fill="#ffffff" stroke="#58806f"/>
        <ellipse cx="12" cy="-6" rx="10" ry="10" fill="#ffffff" stroke="#58806f"/>
        <ellipse cx="0" cy="8" rx="10" ry="10" fill="#f1e8d0" stroke="#a6864a"/>
        <rect x="-8" y="22" width="16" height="6" fill="#a6864a"/>
      </g>
      <text x="282" y="250" text-anchor="middle" font-size="16" font-weight="700" fill="#58806f">花</text>
      <text x="282" y="278" text-anchor="middle" font-size="12" fill="#1f2d27">仏花</text>
      <text x="282" y="298" text-anchor="middle" font-size="11" fill="#4a5b54">仏前を飾る</text>
      <text x="282" y="316" text-anchor="middle" font-size="11" fill="#4a5b54">生花</text>
    </g>

    <g>
      <rect x="370" y="120" width="135" height="220" rx="10" fill="#ffffff" stroke="#a6864a" stroke-width="2"/>
      <g transform="translate(437, 200)">
        <ellipse cx="0" cy="-22" rx="6" ry="14" fill="#f1e8d0"/>
        <rect x="-3" y="-10" width="6" height="14" fill="#a6864a"/>
        <ellipse cx="0" cy="14" rx="28" ry="10" fill="#a6864a"/>
        <rect x="-28" y="-2" width="56" height="14" fill="#a6864a"/>
      </g>
      <text x="437" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#a6864a">灯明</text>
      <text x="437" y="278" text-anchor="middle" font-size="12" fill="#1f2d27">ろうそく</text>
      <text x="437" y="298" text-anchor="middle" font-size="11" fill="#4a5b54">霊の道しるべ</text>
      <text x="437" y="316" text-anchor="middle" font-size="11" fill="#4a5b54">となる灯り</text>
    </g>

    <g>
      <rect x="525" y="120" width="135" height="220" rx="10" fill="#ffffff" stroke="#58806f" stroke-width="2"/>
      <g transform="translate(592, 200)">
        <path d="M -22 -10 Q -22 24 0 24 Q 22 24 22 -10 Z" fill="#ffffff" stroke="#58806f" stroke-width="2"/>
        <ellipse cx="0" cy="-10" rx="22" ry="6" fill="#d6e1d8" stroke="#58806f"/>
        <ellipse cx="0" cy="-10" rx="14" ry="4" fill="#58806f" opacity="0.4"/>
      </g>
      <text x="592" y="250" text-anchor="middle" font-size="15" font-weight="700" fill="#58806f">浄水</text>
      <text x="592" y="278" text-anchor="middle" font-size="12" fill="#1f2d27">清らかな水</text>
      <text x="592" y="298" text-anchor="middle" font-size="11" fill="#4a5b54">心を清める</text>
      <text x="592" y="316" text-anchor="middle" font-size="11" fill="#4a5b54">お供え</text>
    </g>

    <g>
      <rect x="680" y="120" width="60" height="220" rx="10" fill="#ffffff" stroke="#a6864a" stroke-width="2"/>
      <g transform="translate(710, 200)">
        <ellipse cx="0" cy="0" rx="20" ry="8" fill="#a6864a"/>
        <path d="M -16 0 Q 0 -16 16 0 Z" fill="#ffffff" stroke="#a6864a"/>
        <ellipse cx="0" cy="-3" rx="10" ry="3" fill="#a6864a" opacity="0.3"/>
      </g>
      <text x="710" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#a6864a">飲食</text>
      <text x="710" y="272" text-anchor="middle" font-size="10" fill="#1f2d27">仏飯</text>
      <text x="710" y="290" text-anchor="middle" font-size="10" fill="#4a5b54">日々の</text>
      <text x="710" y="306" text-anchor="middle" font-size="10" fill="#4a5b54">食事</text>
    </g>

    <rect x="60" y="370" width="680" height="42" rx="6" fill="#f1ede2" stroke="#d3d9d0"/>
    <text x="400" y="396" text-anchor="middle" font-size="12" fill="#1f2d27">五供（香・花・灯明・浄水・飲食）は仏前にお供えする 5 つの基本</text>
  </g>
</svg>
