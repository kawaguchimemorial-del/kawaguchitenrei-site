<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="花祭壇と白木祭壇の特徴をイメージで比較した図">
  <rect width="800" height="450" fill="#faf8f3"/>
  <g font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif" fill="#131c18">
    <text x="400" y="58" text-anchor="middle" font-size="22" font-weight="600">花祭壇と白木祭壇</text>

    <g>
      <rect x="80" y="100" width="320" height="316" rx="10" fill="#ffffff" stroke="#58806f" stroke-width="2"/>
      <rect x="80" y="100" width="320" height="42" fill="#58806f" rx="10"/>
      <rect x="80" y="128" width="320" height="14" fill="#58806f"/>
      <text x="240" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">花祭壇</text>

      <g transform="translate(240, 230)">
        <ellipse cx="0" cy="0" rx="100" ry="60" fill="#d6e1d8" stroke="#58806f"/>
        <ellipse cx="-50" cy="-15" rx="22" ry="22" fill="#ffffff" stroke="#58806f"/>
        <ellipse cx="-20" cy="-30" rx="20" ry="20" fill="#f1e8d0" stroke="#a6864a"/>
        <ellipse cx="20" cy="-25" rx="22" ry="22" fill="#ffffff" stroke="#58806f"/>
        <ellipse cx="50" cy="-10" rx="18" ry="18" fill="#d6e1d8" stroke="#58806f"/>
        <ellipse cx="0" cy="5" rx="22" ry="22" fill="#ffffff" stroke="#58806f"/>
        <ellipse cx="-35" cy="15" rx="16" ry="16" fill="#f1e8d0" stroke="#a6864a"/>
        <ellipse cx="35" cy="15" rx="18" ry="18" fill="#ffffff" stroke="#58806f"/>
        <rect x="-30" y="-50" width="50" height="34" fill="#ffffff" stroke="#1f2d27"/>
      </g>

      <g font-size="13" fill="#1f2d27">
        <text x="100" y="335">・柔らかく華やかな雰囲気</text>
        <text x="100" y="358">・故人らしさを表現しやすい</text>
        <text x="100" y="381">・無宗教葬・自由葬と相性</text>
        <text x="100" y="404">・規模の調整が柔軟</text>
      </g>
    </g>

    <g>
      <rect x="420" y="100" width="320" height="316" rx="10" fill="#ffffff" stroke="#a6864a" stroke-width="2"/>
      <rect x="420" y="100" width="320" height="42" fill="#a6864a" rx="10"/>
      <rect x="420" y="128" width="320" height="14" fill="#a6864a"/>
      <text x="580" y="128" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">白木祭壇</text>

      <g transform="translate(580, 230)">
        <rect x="-90" y="20" width="180" height="22" fill="#f1e8d0" stroke="#a6864a"/>
        <rect x="-80" y="-2" width="160" height="22" fill="#f1e8d0" stroke="#a6864a"/>
        <rect x="-70" y="-24" width="140" height="22" fill="#f1e8d0" stroke="#a6864a"/>
        <rect x="-60" y="-46" width="120" height="22" fill="#f1e8d0" stroke="#a6864a"/>
        <rect x="-25" y="-78" width="50" height="32" fill="#ffffff" stroke="#1f2d27"/>
        <rect x="-15" y="-2" width="30" height="22" fill="#ffffff" stroke="#1f2d27"/>
      </g>

      <g font-size="13" fill="#1f2d27">
        <text x="440" y="335">・伝統的で厳粛な雰囲気</text>
        <text x="440" y="358">・仏式葬儀の伝統に沿う</text>
        <text x="440" y="381">・菩提寺との関係を大切に</text>
        <text x="440" y="404">・花祭壇と組合せも可能</text>
      </g>
    </g>
  </g>
</svg>
